junit = "6.1.3"
assertj = "3.27.7"
anthropic = "2.65.0"
joda-time = "2.14.4"

[libraries]
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
